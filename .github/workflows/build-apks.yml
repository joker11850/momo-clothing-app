name: Build Clothing Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build both APKs
        run: gradle :admin-app:assembleDebug :customer-app:assembleDebug

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: clothing-admin-debug
          path: admin-app/build/outputs/apk/debug/*.apk

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: clothing-customer-debug
          path: customer-app/build/outputs/apk/debug/*.apk
